<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Simplified app icon for small sizes: the galaxy fills the tile, no orbit or starfield. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#1a2156"/>
      <stop offset="1" stop-color="#04050f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffb870" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#fff0cf"/>
      <stop offset="0.7" stop-color="#ffc27a" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffc27a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <g transform="rotate(-16 32 32)">
    <ellipse cx="32" cy="32" rx="30" ry="9" fill="url(#glow)"/>
    <ellipse cx="32" cy="32" rx="15" ry="12" fill="url(#core)"/>
    <ellipse cx="32" cy="33.2" rx="29" ry="1.8" fill="#04030a"/>
  </g>
  <circle cx="13" cy="20" r="3" fill="#4ef2c8"/>
</svg>
